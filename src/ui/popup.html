<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:system-ui,sans-serif;width:420px;margin:0;padding:14px;background:#0f172a;color:#e2e8f0}
    h2{margin:0 0 10px;font-size:17px}
    .bar{display:flex;gap:6px;margin-bottom:10px}
    button{border:0;border-radius:7px;padding:7px 10px;cursor:pointer}
    .card{background:#1e293b;border-radius:10px;padding:10px;margin:8px 0}
    .good{color:#4ade80}.warn{color:#fbbf24}.bad{color:#fb7185}.muted{color:#94a3b8}
    table{width:100%;font-size:12px;border-collapse:collapse}
    td,th{padding:4px;text-align:left;border-bottom:1px solid #334155}
    code{font-size:11px}
  </style>
</head>
<body>
  <h2>AUTO CALL MONITOR </h2>
  <div class="bar">
    <button id="clear">Clear samples</button>
  </div>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
